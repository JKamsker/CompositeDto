name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CompositeDto.Generator.sln

      - name: Build
        run: dotnet build CompositeDto.Generator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CompositeDto.Generator.sln --configuration Release --no-build --logger trx

      - name: Pack source generator
        run: dotnet pack CompositeDto.Generator/CompositeDto.Generator.csproj --configuration Release --no-build --output artifacts

      - name: Upload source generator artifact
        uses: actions/upload-artifact@v4
        with:
          name: composite-dto-sourcegen
          path: artifacts/*.nupkg
          if-no-files-found: error
