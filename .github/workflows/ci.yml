name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore CompositeDto.Generator.sln

      - name: Build
        run: dotnet build CompositeDto.Generator.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test CompositeDto.Generator.sln --configuration Release --no-build --logger trx

      - name: Pack source generator
        run: dotnet pack CompositeDto.Generator/CompositeDto.Generator.csproj --configuration Release --no-build --output artifacts

      - name: Upload source generator artifact
        uses: actions/upload-artifact@v4
        with:
          name: composite-dto-sourcegen
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Retrieve secrets from Bitwarden
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.BW_ACCESS_TOKEN }}
          base_url: https://vault.bitwarden.eu
          secrets: |
            265b2fb6-2cf0-4859-9bc8-b24c00ab4378 > NUGET_API_KEY

      - name: Push package to NuGet
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
